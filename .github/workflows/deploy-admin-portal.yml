name: Build and Deploy Admin Portal

on:
  push:
    branches:
      - main
      - release/adminportal-domain
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build admin-portal and deploy to gh-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install & build admin-portal
        working-directory: admin-portal
        run: |
          npm ci
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./admin-portal/build
          publish_branch: gh-pages
